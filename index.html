<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人博客</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            /* 液态玻璃轻量化参数 */
            --glass-blur: 6px;
            --glass-saturate: 120%;
            --glass-radius: 22px;
            --gap-panel: 16px;
            --edge-highlight: rgba(255, 255, 255, 0.55);
            --edge-dark: rgba(255, 255, 255, 0.15);
            --shadow-light: 0 0 10px rgba(255, 255, 255, 0.18);
            --bg-image: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80');
            --body-padding: 24px;
            --content-padding: 32px;
            --auto-collapse-delay: 8000; /* 8秒自动收起 */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-image) no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding: var(--body-padding);
            display: flex;
            gap: 24px;
            transition: color 0.3s ease;
            overflow-x: hidden;
        }

        /* 深色浅色主题变量 */
        html[data-theme="dark"] {
            --text-color: #f5f5f7;
            --glass-bg: rgba(22, 22, 26, 0.45);
            --border-top: rgba(255,255,255,0.2);
            --border-rest: rgba(255,255,255,0.06);
        }
        html[data-theme="light"] {
            --text-color: #1d1d1f;
            --glass-bg: rgba(255, 255, 255, 0.32);
            --border-top: rgba(255,255,255,0.6);
            --border-rest: rgba(255,255,255,0.2);
        }
        html[data-theme="auto"] {
            --text-color: #1d1d1f;
            --glass-bg: rgba(255, 255, 255, 0.32);
            --border-top: rgba(255,255,255,0.6);
            --border-rest: rgba(255,255,255,0.2);
        }
        @media (prefers-color-scheme: dark) {
            html[data-theme="auto"] {
                --text-color: #f5f5f7;
                --glass-bg: rgba(22, 22, 26, 0.45);
                --border-top: rgba(255,255,255,0.2);
                --border-rest: rgba(255,255,255,0.06);
            }
        }
        body {
            color: var(--text-color);
        }

        /* 玻璃基础样式 + 入场动画 */
        .glass-panel {
            backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
            background: var(--glass-bg);
            border-radius: var(--glass-radius);
            border-top: 1px solid var(--border-top);
            border-left: 1px solid var(--border-top);
            border-right: 1px solid var(--border-rest);
            border-bottom: 1px solid var(--border-rest);
            box-shadow: var(--shadow-light), 0 6px 20px rgba(0,0,0,0.06);

            opacity: 0;
            transform: translateY(12px);
            animation: panelFadeIn 0.6s ease-out forwards;
        }
        @keyframes panelFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .sidebar-nav { animation-delay: 0.1s; }
        .path-box { animation-delay: 0.2s; }
        .main-right { animation-delay: 0.3s; }
        .author-bar { animation-delay: 0.4s; }

        /* ========== 左侧侧边栏容器 ========== */
        .sidebar-wrap {
            width: 270px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: var(--gap-panel);
            transition: all 0.5s cubic-bezier(0.4,0,0.2,1);
            position: relative;
        }
        /* 完全收起状态 */
        .sidebar-wrap.collapsed {
            width: 0;
            opacity: 0;
            overflow: visible;
        }
        /* 收起后悬浮发光按钮 */
        .sidebar-trigger-dot {
            position: fixed;
            top: 24px;
            left: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(6px);
            background: var(--glass-bg);
            box-shadow: 0 0 12px 3px rgba(255,255,255,0.4);
            z-index: 999;
            animation: pulseGlow 2s infinite ease-in-out;
        }
        @keyframes pulseGlow {
            0%,100% { box-shadow: 0 0 12px 3px rgba(255,255,255,0.4); }
            50% { box-shadow: 0 0 20px 6px rgba(255,255,255,0.6); }
        }
        .sidebar-wrap.collapsed + .sidebar-trigger-dot {
            display: flex;
        }

        /* 顶部导航面板 */
        .sidebar-nav {
            padding: 20px;
            position: relative;
        }
        .collapse-btn {
            position: absolute;
            top: 14px;
            right: 16px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border-top);
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.3s ease;
        }
        .sidebar-wrap.collapsed .collapse-btn {
            transform: rotate(180deg);
        }
        .blog-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        /* 单个主题切换按钮 太阳月亮 */
        .theme-toggle-single {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid var(--border-top);
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
        }
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .nav-links a {
            color: inherit;
            text-decoration: none;
            opacity: 0.75;
            padding: 5px 12px;
            border-radius: 14px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .nav-links a:hover,
        .nav-links a.active {
            opacity: 1;
            background: rgba(255,255,255,0.35);
        }

        /* 分割线 */
        .divider-line {
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-top), transparent);
            margin: 0 auto;
        }

        /* 路径面板 收起/展开样式区分 */
        .path-box {
            padding: 16px 20px;
            font-family: 'SF Mono', monospace;
            font-size: 1.1rem;
            font-weight: 500;
            line-height: 1.5;
            white-space: pre;
            transition: font-size 0.3s;
        }

        /* ========== 右侧主内容 ========== */
        .main-right {
            flex: 1;
            min-width: 0;
            padding: var(--content-padding);
        }
        .content-wrap {
            width: 100%;
            height: 100%;
        }
        .content {
            display: none;
            opacity: 0;
            transform: translateY(8px);
            transition: all 0.4s ease;
        }
        .content.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* 首页个人卡片 */
        .home-card .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--border-top);
            margin-bottom: 16px;
        }
        .home-card h2 {
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .home-card .bio {
            line-height: 1.7;
            font-size: 1.05rem;
            opacity: 0.9;
        }
        .external-links {
            margin-top: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .external-links a {
            color: inherit;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 99px;
            background: rgba(255,255,255,0.25);
            border: 1px solid var(--border-top);
            transition: 0.2s;
        }
        .external-links a:hover {
            background: rgba(255,255,255,0.45);
        }

        /* 文章列表卡片 */
        .post-card {
            padding: 16px 20px;
            margin-bottom: 14px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .post-card:hover {
            transform: translateY(-2px);
            background: rgba(255,255,255,0.4);
        }
        .post-card h3 {
            font-size: 1.3rem;
            margin-bottom: 6px;
        }
        .post-card .meta {
            font-size: 0.85rem;
            opacity: 0.7;
            display: flex;
            gap: 16px;
        }

        /* 弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(3px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal {
            width: 100%;
            max-width: 760px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 16px;
            right: 20px;
            border: none;
            background: transparent;
            font-size: 28px;
            cursor: pointer;
            color: inherit;
        }

        /* ========== 左下角作者悬浮栏（自定义提示文字） ========== */
        .author-bar {
            position: fixed;
            left: 0;
            bottom: 40px;
            border-radius: 0 28px 28px 0;
            padding: 14px 20px 14px 12px;
            z-index: 998;
            cursor: pointer;
            width: 120px;
            overflow: hidden;
            transition: width 0.3s ease, background 0.3s ease;
        }
        .author-bar:hover {
            width: 280px;
            background: rgba(255,255,255,0.45);
            box-shadow: 0 0 16px rgba(255,255,255,0.25);
        }
        .author-inner {
            display: flex;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
        }
        .author-bar .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid var(--border-top);
            flex-shrink: 0;
        }
        .author-info {
            display: flex;
            flex-direction: column;
        }
        .author-name {
            font-weight: 600;
        }
        .author-sub {
            font-size: 0.8rem;
            opacity: 0.7;
        }

        /* 移动端适配 */
        @media (max-width: 900px) {
            body {
                flex-direction: column;
            }
            .sidebar-wrap {
                width: 100%;
            }
            .sidebar-wrap.collapsed {
                width: 100%;
            }
            .sidebar-trigger-dot {
                top: 16px;
                left: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- 左侧侧边栏主体 -->
    <div class="sidebar-wrap" id="sidebarWrap">
        <div class="glass-panel sidebar-nav">
            <div class="collapse-btn" id="collapseSidebar">◀</div>
            <div class="blog-title">
                📘 博客
                <div class="theme-toggle-single" id="themeSingleBtn">🌙</div>
            </div>
            <div class="nav-links">
                <a class="active" data-tab="home">自我简介</a>
                <a data-tab="solution">题解</a>
                <a data-tab="daily">刷题历程</a>
                <a data-tab="notes">杂事</a>
            </div>
        </div>

        <div class="divider-line"></div>

        <div class="glass-panel path-box" id="pathBox">博客 → 自我简介</div>
    </div>

    <!-- 收起后发光激活按钮 -->
    <div class="sidebar-trigger-dot" id="triggerDot">)</div>

    <!-- 右侧主内容区 -->
    <div class="glass-panel main-right">
        <div class="content-wrap">
            <div class="content active" id="tab-home">
                <div class="home-card">
                    <img class="avatar" id="homeAvatar" alt="头像">
                    <h2 id="homeName"></h2>
                    <p class="bio" id="homeBio"></p>
                    <div class="external-links">
                        <a id="linkGithub" target="_blank">GitHub</a>
                        <a id="linkLuogu" target="_blank">洛谷主页</a>
                    </div>
                </div>
            </div>
            <div class="content" id="tab-solution">
                <div id="postsSolution"></div>
            </div>
            <div class="content" id="tab-daily">
                <div id="postsDaily"></div>
            </div>
            <div class="content" id="tab-notes">
                <div id="postsNotes"></div>
            </div>
        </div>
    </div>

    <!-- 文章弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="glass-panel modal">
            <button class="close-btn" id="closeModal">&times;</button>
            <h2 id="modalTitle"></h2>
            <div class="article-meta" id="modalMeta" style="opacity:0.7;margin:12px 0 24px;"></div>
            <div class="article-body" id="modalBody"></div>
        </div>
    </div>

    <!-- 左下角作者悬浮栏（可自定义下方小字） -->
    <div class="glass-panel author-bar" id="authorBar">
        <div class="author-inner">
            <img class="avatar" id="authorAvatar" alt="头像">
            <div class="author-info">
                <div class="author-name" id="authorName">加载中</div>
                <!-- 这里直接修改引号内文字即可自定义 -->
                <div class="author-sub">鼠标悬停查看更多信息</div>
            </div>
        </div>
    </div>

<script>
// ====================== 【可自定义配置区】 ======================
const CONFIG = {
    GITHUB_OWNER: "put_togetherXX",
    GITHUB_REPO: "blog-of-put_togetherXX",
    LUOGU_URL: "https://www.luogu.com.cn/user/你的洛谷ID",
    // 左下角悬浮栏底部提示文字，直接改这里
    hoverTipText: "鼠标悬停查看更多信息",
    autoCollapseTime: 8000 // 8秒自动收起，单位毫秒
};
const LABEL_MAP = {
    solution: "题解",
    daily: "刷题历程",
    notes: "杂事"
};
// ==============================================================

// DOM元素
const sidebarWrap = document.getElementById("sidebarWrap");
const collapseBtn = document.getElementById("collapseSidebar");
const triggerDot = document.getElementById("triggerDot");
const themeSingleBtn = document.getElementById("themeSingleBtn");
const pathBox = document.getElementById("pathBox");
const navLinks = document.querySelectorAll(".nav-links a");
const tabContents = {
    home: document.getElementById("tab-home"),
    solution: document.getElementById("tab-solution"),
    daily: document.getElementById("tab-daily"),
    notes: document.getElementById("tab-notes")
};
const postContainers = {
    solution: document.getElementById("postsSolution"),
    daily: document.getElementById("postsDaily"),
    notes: document.getElementById("postsNotes")
};
const modalOverlay = document.getElementById("modalOverlay");
const modalTitle = document.getElementById("modalTitle");
const modalMeta = document.getElementById("modalMeta");
const modalBody = document.getElementById("modalBody");
const closeModal = document.getElementById("closeModal");

// 主题状态
const htmlRoot = document.documentElement;
let currentTheme = localStorage.getItem("blog-theme") || "auto";
let autoCollapseTimer = null;

// 初始化主题单按钮
function initTheme() {
    updateThemeIcon(currentTheme);
    htmlRoot.setAttribute("data-theme", currentTheme);
}
function toggleSingleTheme() {
    const order = ["light", "dark", "auto"];
    let idx = order.indexOf(currentTheme);
    idx = (idx + 1) % 3;
    currentTheme = order[idx];
    localStorage.setItem("blog-theme", currentTheme);
    htmlRoot.setAttribute("data-theme", currentTheme);
    updateThemeIcon(currentTheme);
}
function updateThemeIcon(mode) {
    if (mode === "dark") themeSingleBtn.textContent = "☀️";
    else themeSingleBtn.textContent = "🌙";
}
themeSingleBtn.addEventListener("click", toggleSingleTheme);
initTheme();

// 侧边栏自动计时收起
function resetAutoCollapseTimer() {
    clearTimeout(autoCollapseTimer);
    autoCollapseTimer = setTimeout(() => {
        if (!sidebarWrap.classList.contains("collapsed")) {
            collapseSidebar();
        }
    }, CONFIG.autoCollapseTime);
}

// 侧边栏收起展开核心逻辑
function collapseSidebar() {
    sidebarWrap.classList.add("collapsed");
    collapseBtn.textContent = "▶";
    clearTimeout(autoCollapseTimer);
}
function expandSidebar() {
    sidebarWrap.classList.remove("collapsed");
    collapseBtn.textContent = "◀";
    resetAutoCollapseTimer();
}
collapseBtn.addEventListener("click", expandSidebar);
triggerDot.addEventListener("click", expandSidebar);
// 鼠标移入侧边栏重置倒计时
sidebarWrap.addEventListener("mouseenter", resetAutoCollapseTimer);

// 更新路径文本
function updatePathText(tabKey) {
    const nameMap = {
        home: "自我简介",
        solution: "题解",
        daily: "刷题历程",
        notes: "杂事"
    };
    pathBox.textContent = `博客 → ${nameMap[tabKey]}`;
}

// 导航切换 + 内容展开动画
navLinks.forEach(link => {
    link.addEventListener("click", (e) => {
        e.preventDefault();
        const targetTab = link.dataset.tab;
        // 激活导航
        navLinks.forEach(l => l.classList.remove("active"));
        link.classList.add("active");
        // 内容切换带动画
        Object.values(tabContents).forEach(el => {
            el.classList.remove("active");
        });
        tabContents[targetTab].classList.add("active");
        updatePathText(targetTab);
        // 切换页面重置8秒倒计时
        resetAutoCollapseTimer();
    });
});

// 弹窗控制
function openPostModal(post) {
    modalTitle.innerText = post.title;
    modalMeta.innerText = `发布于 ${new Date(post.created_at).toLocaleString()}`;
    modalBody.innerHTML = marked.parse(post.body || "");
    modalOverlay.style.display = "flex";
    document.body.style.overflow = "hidden";
}
function closePostModal() {
    modalOverlay.style.display = "none";
    document.body.style.overflow = "";
}
closeModal.addEventListener("click", closePostModal);
modalOverlay.addEventListener("click", e => e.target === modalOverlay && closePostModal());
document.addEventListener("keydown", e => e.key === "Escape" && closePostModal());

// HTML转义
function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
}

// 拉取文章列表
let allIssues = [];
async function loadArticles() {
    try {
        const res = await fetch(`https://api.github.com/repos/${CONFIG.GITHUB_OWNER}/${CONFIG.GITHUB_REPO}/issues?per_page=100&state=open`);
        if (!res.ok) throw new Error();
        const rawList = await res.json();
        allIssues = rawList.filter(item => !item.pull_request);
        renderArticleList();
    } catch (err) {
        Object.values(postContainers).forEach(wrap => {
            wrap.innerHTML = `<div class="post-card glass-panel">加载失败，请切换手机热点访问</div>`;
        });
    }
}
function renderArticleList() {
    const group = { solution: [], daily: [], notes: [] };
    allIssues.forEach(iss => {
        const 标签 = iss.labels.map(tag => tag.name);
        for (const key in LABEL_MAP) {
            if (标签.includes(key)) {
                group[key].push(iss);
                break;
            }
        }
    });
    for (const key in group) {
        const arr = group[key];
        if (!arr.length) {
            postContainers[key].innerHTML = `<div class="post-card glass-panel">暂无${LABEL_MAP[key]}内容</div>`;
            continue;
        }
        arr.forEach(post => {
            const card = document.createElement("div");
            card.className = "post-card glass-panel";
            card.innerHTML = `
                <h3>${escapeHtml(post.title)}</h3>
                <div class="meta">
                    <span>📅 ${new Date(post.created_at).toLocaleDateString()}</span>
                    <span>💬 ${post.comments} 评论</span>
                </div>
            `;
            card.addEventListener("click", () => openPostModal(post));
            postContainers[key].appendChild(card);
        });
    }
}

// 加载作者信息
async function loadAuthorInfo() {
    try {
        const res = await fetch(`https://api.github.com/users/${CONFIG.GITHUB_OWNER}`);
        const user = await res.json();
        const avatarUrl = user.avatar_url;
        const userName = user.name || user.login;
        const userBio = user.bio || "暂无个人简介";

        document.getElementById("authorAvatar").src = avatarUrl;
        document.getElementById("authorName").innerText = userName;
        document.getElementById("homeAvatar").src = avatarUrl;
        document.getElementById("homeName").innerText = userName;
        document.getElementById("homeBio").innerText = userBio;
        document.getElementById("linkGithub").href = user.html_url;
        document.getElementById("linkLuogu").href = CONFIG.LUOGU_URL;

        // 同步自定义悬浮提示
        document.querySelector(".author-sub").innerText = CONFIG.hoverTipText;
    } catch (err) {
        document.getElementById("authorName").innerText = CONFIG.GITHUB_OWNER;
        document.getElementById("homeName").innerText = CONFIG.GITHUB_OWNER;
    }
}

// 页面初始化执行
updatePathText("home");
loadAuthorInfo();
loadArticles();
resetAutoCollapseTimer();
</script>
</body>
</html>
